[localforge]
# GitHub personal access token.
github_token =
# GitHub organization or user name.
github_owner =
# Target repository name.
github_repository =
# Seconds between issue polls.
poll_interval_seconds =
# Directory for checked-out workspaces.
workspace_root =
# Label for issues ready for AI work.
ai_ready_label =
# Label for issues currently being processed.
ai_working_label =
# Codex mode: `codex` for the standard CLI, or `lm-studio` for local OSS mode.
codex_mode = codex
# Model passed to `codex --oss -m` when codex_mode is lm-studio.
codex_model = unsloth/qwen3-coder-30b-a3b-instruct
